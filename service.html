<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রকৃতির সেবা | প্রকৃতির গুঞ্জন</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">

    <style>
        /* ===== Shudhu service page er design ===== */
        .service-wrap {
            display: flex;
            justify-content: center;
            width: 92%;
            max-width: 700px;
            margin: 90px auto;
        }

        .service-card {
            position: relative;
            width: 100%;
            padding: 44px 34px 38px;
            text-align: center;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(255,255,255,0.80), rgba(214,245,227,0.58));
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow:
                0 0 20px rgba(57, 255, 20, 0.30),
                0 0 50px rgba(34, 197, 94, 0.24),
                inset 0 1px 2px rgba(255, 255, 255, 0.9),
                0 16px 40px rgba(23, 102, 74, 0.15);
            animation: serviceGlow 3s ease-in-out infinite;
        }

        @keyframes serviceGlow {
            0%, 100% {
                box-shadow:
                    0 0 16px rgba(57,255,20,0.24),
                    0 0 40px rgba(34,197,94,0.18),
                    inset 0 1px 2px rgba(255,255,255,0.9),
                    0 16px 40px rgba(23,102,74,0.15);
            }
            50% {
                box-shadow:
                    0 0 26px rgba(57,255,20,0.45),
                    0 0 64px rgba(34,197,94,0.34),
                    inset 0 1px 2px rgba(255,255,255,0.9),
                    0 16px 40px rgba(23,102,74,0.15);
            }
        }

        .service-icon {
            display: inline-block;
            font-size: 62px;
            line-height: 1;
            animation: bob 2.6s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50%      { transform: translateY(-9px) rotate(6deg); }
        }

        .service-title {
            margin: 12px 0 10px;
            font-size: 28px;
            font-weight: 800;
            color: #0b4a2b;
        }

        .service-badge {
            display: inline-block;
            margin-bottom: 18px;
            padding: 5px 18px;
            font-size: 15px;
            font-weight: 700;
            color: #0b4a2b;
            background: rgba(217, 247, 228, 0.9);
            border: 1px solid #a8e6bd;
            border-radius: 30px;
        }

       .service-text {
    margin: 0 0 10px;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.9;
    color: #1f3a2c;
}

        @media (max-width: 600px) {
            .service-wrap { margin: 50px auto; }
            .service-card { padding: 34px 20px 28px; }
            .service-title { font-size: 24px; }
            .service-text { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <b>প্রকৃতির গুঞ্জন</b>
        <div>
            <a href="index.html">হোম</a>
            <a href="about.html">পরিচিতি</a>
            <a href="service.html" class="active">প্রকৃতির সেবা</a>
            <a href="contact.html">যোগাযোগ</a>
        </div>
    </div>

    <div class="service-wrap">
        <div class="service-card reveal">
            <div class="service-icon">🌱</div>

            <p class="service-text">
                এই পেজটি এখনো নির্মাণাধীন আছে।
            </p>
            <p class="service-text">
                ইনশাআল্লাহ, খুব শীঘ্রই এই পেজের কার্যক্রম শুরু হবে।
                ততদিন আমাদের সাথেই থাকুন 🌿
            </p>
        </div>
    </div>

    <script src="shared.js"></script>
</body>
</html>
