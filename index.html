/* ===== Loading Window (final) ===== */

/* Default e lukano thakbe, JS "show" class dile dekhabe */
#loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(7, 27, 22, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}

#loader.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.loader-card {
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    width: min(400px, 88%);
    padding: 20px 26px 18px;
    text-align: center;
    background: linear-gradient(
        135deg,
        rgba(244, 255, 249, 0.82),
        rgba(214, 245, 227, 0.66)
    );
    backdrop-filter: blur(18px) saturate(150%) brightness(1.08);
    -webkit-backdrop-filter: blur(18px) saturate(150%) brightness(1.08);
    border: 1.5px solid rgba(255, 255, 255, 0.75);
    border-radius: 26px;
    box-shadow:
        0 0 18px rgba(57, 255, 20, 0.30),
        0 0 46px rgba(34, 197, 94, 0.24),
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        0 16px 40px rgba(0, 0, 0, 0.20);
    animation: cardGlow 2.5s ease-in-out infinite;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(25px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes cardGlow {
    0%, 100% {
        box-shadow: 0 0 18px rgba(57,255,20,0.35), 0 0 45px rgba(34,197,94,0.28), 0 20px 50px rgba(0,0,0,0.25);
    }
    50% {
        box-shadow: 0 0 28px rgba(57,255,20,0.6), 0 0 70px rgba(34,197,94,0.45), 0 20px 50px rgba(0,0,0,0.25);
    }
}

/* Pata icon */
.loader-icon {
    position: relative;
    width: 72px;
    height: 72px;
    margin: 0 auto 2px;
}

.loader-leaf {
    width: 100%;
    height: 100%;
    transform-origin: 50% 90%;
    animation: sway 2.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(21, 128, 61, 0.35));
}

@keyframes sway {
    0%, 100% { transform: rotate(-7deg) scale(1); }
    50%      { transform: rotate(7deg) scale(1.06); }
}

/* zzz */
.zzz {
    position: absolute;
    top: 0;
    right: -10px;
    color: #15803d;
    font-weight: 800;
    font-size: 17px;
    line-height: 1;
}

.zzz small {
    display: inline-block;
    font-size: 0.8em;
    margin-left: 2px;
}

.zzz,
.zzz small {
    animation: zzzFloat 2.2s ease-in-out infinite;
}

.zzz small:nth-child(1) { animation-delay: 0.3s; }
.zzz small:nth-child(2) { animation-delay: 0.6s; }

@keyframes zzzFloat {
    0%, 100% { opacity: 0.25; transform: translateY(4px); }
    50%      { opacity: 1;    transform: translateY(-5px); }
}

/* Lekha */
.loader-title {
    margin: 2px 0 4px;
    color: #0f5c36;
    font-size: 25px;
    font-weight: 800;
}

.loader-msg {
    min-height: 24px;
    margin: 0 0 10px;
    color: #14532d;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
}

.loader-sub {
    margin: 9px 0 0;
    color: #166534;
    font-size: 13px;
}

/* Progress bar */
.loader-bar {
    height: 10px;
    overflow: hidden;
    background: rgba(195, 232, 207, 0.7);
    border-radius: 20px;
}
.loader-title {
    color: #0b4a2b;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
}

.loader-msg {
    color: #0f3d24;
}

.loader-sub {
    color: #0b4a2b;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
}

.loader-bar {
    background: rgba(255, 255, 255, 0.55);
    box-shadow: inset 0 1px 3px rgba(23, 102, 74, 0.2);
}

.loader-fill {
    width: 0;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #16a34a, #4ade80, #16a34a);
    background-size: 200% 100%;
    animation: shine 1.4s linear infinite;
}

@keyframes shine {
    from { background-position: 200% 0; }
    to   { background-position: 0 0; }
}

/* Vasha pata */
.fl {
    position: absolute;
    top: -30px;
    font-size: 18px;
    opacity: 0.7;
    pointer-events: none;
    animation: fall 6s linear infinite;
}

.fl1 { left: 12%; animation-delay: 0s; }
.fl2 { left: 50%; animation-delay: 2s; font-size: 15px; }
.fl3 { left: 82%; animation-delay: 4s; }

@keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    15%  { opacity: 0.7; }
    100% { transform: translateY(240px) rotate(280deg); opacity: 0; }
}
/* Mobile */
@media (max-width: 500px) {

    .loader-icon  { width: 90px; height: 90px; }

const LOADER_MIN = 4500;   // loader kom pokkhe koto ms thakbe (3500 = 3.5 sec)

let lastMsgIndex = -1;
function pickMessage() {
    if (funMessages.length === 1) return funMessages[0];
    let n;
    do {
        n = Math.floor(Math.random() * funMessages.length);
    } while (n === lastMsgIndex);
    lastMsgIndex = n;
    return funMessages[n];
}

function showLoader() {
    return new Promise(function (resolve) {
        const loader = document.getElementById("loader");
        const fill   = document.getElementById("loaderFill");
        const msgEl  = document.getElementById("loaderMsg");
        const subEl  = document.querySelector(".loader-sub");

        const m = pickMessage();
        msgEl.textContent = m.main;
        subEl.textContent = m.sub;

       
        fill.style.transition = "none";
        fill.style.width = "0%";
        void fill.offsetWidth;
        fill.style.transition = "width " + LOADER_MIN + "ms linear";
        fill.style.width = "100%";

        loader.classList.add("show");
        document.body.style.overflow = "hidden";

        setTimeout(function () {
            loader.classList.remove("show");
            document.body.style.overflow = "";
            setTimeout(resolve, 500);   
        }, LOADER_MIN);
    });
}

<script>
const searchForm = document.getElementById("ingredientSearch");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

searchForm.addEventListener("submit", async function(event) {
       event.preventDefault();

    if (document.getElementById("loader").classList.contains("show")) return;
    const query = searchInput.value
    .trim()
    .toLowerCase()
    .replace(/এর উপকারিতা|র উপকারিতা|এর পার্শ্বপ্রতিক্রিয়া|র পার্শ্বপ্রতিক্রিয়া|এর সতর্কতা|র সতর্কতা/g, "")
    .trim();

    if (!query) {
        searchResults.textContent = "আগে কোনো উপাদানের নাম লিখুন।";
        return;
    }

    try {
                // database fetch ar loader ekshathe cholbe, dutoi sesh hole tarpor result
        const [response] = await Promise.all([
            fetch("./Database/ingredients.json"),
            showLoader()
        ]);

        if (!response.ok) {
            throw new Error("JSON file paoya jayni");
        }

        const dbData = await response.json();
        if (!dbData.data) {
            throw new Error("JSON file er structure sothik noy");
        }

        let foundItem = null;

        // ধাপ ১: প্রথমে একদম হুবহু মিল (Exact Match) খুঁজবে (যেমন: "আম" লিখলে শুধু আমই আসবে)
        for (const category in dbData.data) {
            const items = dbData.data[category];
            if (Array.isArray(items)) {
                foundItem = items.find(item => {
                    const bnName = (item.bn_name || "").toLowerCase().trim();
                    const name = (item.name || "").toLowerCase().trim();
                    const enName = (item.en_name || "").toLowerCase().trim();
                    return bnName === query || name === query || enName === query;
                });
                if (foundItem) break;
            }
        }

        // ধাপ ২: হুবহু না পেলে, যা দিয়ে লেখা শুরু হয়েছে (Starts-with) তা খুঁজবে
        if (!foundItem) {
            for (const category in dbData.data) {
                const items = dbData.data[category];
                if (Array.isArray(items)) {
                    foundItem = items.find(item => {
                        const bnName = (item.bn_name || "").toLowerCase().trim();
                        const name = (item.name || "").toLowerCase().trim();
                        const enName = (item.en_name || "").toLowerCase().trim();
                        return bnName.startsWith(query) || name.startsWith(query) || enName.startsWith(query);
                    });
                    if (foundItem) break;
                }
            }
        }

        // ধাপ ৩: অবশেষে সাধারণ আংশিক মিল (Includes) খুঁজবে (আলু, আদা, পেয়ারা ও অন্যান্য সবকিছুর জন্য)
        if (!foundItem) {
            for (const category in dbData.data) {
                const items = dbData.data[category];
                if (Array.isArray(items)) {
                    foundItem = items.find(item => {
                        const bnName = (item.bn_name || "").toLowerCase();
                        const enName = (item.en_name || "").toLowerCase();
                        const name = (item.name || "").toLowerCase();
                        return bnName.includes(query) || enName.includes(query) || name.includes(query);
                    });
                    if (foundItem) break;
                }
            }
        }
        searchResults.replaceChildren();

        if (!foundItem) {
            searchResults.textContent = "ডেটাবেস চ্যাগায়া গেছে । এই উপাদানের তথ্য এখনো আমাদের ডেটাবেসে নেই। তবে নিরাশ হবেন না, ইনশাআল্লাহ খুব শীঘ্রই আমরা আপনার সার্চকৃত উপাদানের তথ্য আমাদের ডেটাবেসে যোগ করব । পর্বর্তীতে আবার আপনার উপাদানের নামটি সার্চ করার জন্য অনুরোধ রইলো । সাময়িক অসুবিধার জন্য আন্তরিকভাবে দুঃখিত ।";
            reportMissing(query); 
            return; 
        }

        // Nam o Baigganik nam Bangla horofe
        const title = document.createElement("h2");
        title.textContent = foundItem.bn_name || foundItem.name;
        searchResults.appendChild(title);

        const scientificName = document.createElement("p");
        scientificName.textContent = "বৈজ্ঞানিক নাম: " + (foundItem.scientific_name || "প্রযোজ্য নয়");
        searchResults.appendChild(scientificName);

        // Shombhabo upokarita
        const benefitsTitle = document.createElement("h3");
        benefitsTitle.textContent = "সম্ভাব্য উপকারিতা";
        searchResults.appendChild(benefitsTitle);

        if (!foundItem.health_benefits || foundItem.health_benefits.length === 0) {
            const p = document.createElement("p");
            p.textContent = "উপকারিতার তথ্য এখনো যোগ করা হয়নি।";
            searchResults.appendChild(p);
        } else {
            const ul = document.createElement("ul");
            foundItem.health_benefits.forEach(benefit => {
                const li = document.createElement("li");
                li.textContent = benefit;
                ul.appendChild(li);
            });
            searchResults.appendChild(ul);
        }
         // Scientific Facts (Baigganik tottho) section add kora holo
        if (foundItem.scientific_facts && foundItem.scientific_facts.length > 0) {
            const sciFactsTitle = document.createElement("h3");
            sciFactsTitle.textContent = "Scientific Facts";
            searchResults.appendChild(sciFactsTitle);

            const sciFactsList = document.createElement("ul");
            foundItem.scientific_facts.forEach(fact => {
                const li = document.createElement("li");
                li.textContent = fact;
                sciFactsList.appendChild(li);
            });
            searchResults.appendChild(sciFactsList);
        }

        // Parshoprotikriya o sotorkota
        const sideTitle = document.createElement("h3");
        sideTitle.textContent = "সম্ভাব্য পার্শ্বপ্রতিক্রিয়া ও সতর্কতা";
        searchResults.appendChild(sideTitle);

        const sideList = document.createElement("ul");
        if (foundItem.side_effects_and_warnings && foundItem.side_effects_and_warnings.length > 0) {
            foundItem.side_effects_and_warnings.forEach(effect => {
                const li = document.createElement("li");
                li.textContent = effect;
                sideList.appendChild(li);
            });
        } else {
            const li = document.createElement("li");
            li.textContent = "কোনো বিশেষ পার্শ্বপ্রতিক্রিয়া নেই।";
            sideList.appendChild(li);
        }
        searchResults.appendChild(sideList);

        // Tottho sutro
        if (foundItem.sources && foundItem.sources.length > 0) {
            const sourceTitle = document.createElement("h3");
            sourceTitle.textContent = "তথ্যসূত্র";
            searchResults.appendChild(sourceTitle);

            const sourceList = document.createElement("ul");
            foundItem.sources.forEach(src => {
                const li = document.createElement("li");
                li.textContent = src;
                sourceList.appendChild(li);
            });
            searchResults.appendChild(sourceList);
        }

    } catch (error) {
        console.error(error);
        searchResults.textContent = "Can't load information. There might be a technical issue with the server ";
    }
});
// ডেটাবেসে নেই এমন সার্চ Web3Forms দিয়ে তোমার মেইলে যাবে
const reportedQueries = new Set();   // একই শব্দ বারবার পাঠাবে না

function reportMissing(q) {
    if (!q) return;

    let sent = [];
    try { sent = JSON.parse(localStorage.getItem("reportedQueries") || "[]"); } catch (e) {}
    if (sent.includes(q)) return;

    sent.push(q);
    try { localStorage.setItem("reportedQueries", JSON.stringify(sent)); } catch (e) {}

    fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
            access_key: "8415e710-fa56-4607-a243-638fc693be18",
            subject: "প্রকৃতির গুঞ্জন: User search",
            message: "ব্যবহারকারী খুঁজেছে: " + q +
                     "\nসাইট: " + location.origin +
                     "\nসময়: " + new Date().toLocaleString("bn-BD"),
            botcheck: ""
        })
    }).catch(function () {});
}
</script>
